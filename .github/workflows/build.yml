# =====================================================================
# GENESIS v3 — cloud build (GitHub Actions, free tier)
#
# Trigger: workflow_dispatch (Actions tab > Run workflow).
# Builds the GENESIS setup .exe on a cloud Windows runner and attaches
# it to the v3-modular release. Father downloads ONE .exe link. Done.
#
# Large files travel as byte-verified 64MB parts (the upload host caps
# single files): they are downloaded part-by-part and reassembled on
# the runner. Large binaries are NEVER committed to the repo.
#
# Action pins (commit SHA, verified 2026-10-12 via api.github.com):
#   actions/checkout@v5.1.0      fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   actions/setup-python@v5.6.0  a26af69be951a213d495a4c3e4e4022e16d87065
#   softprops/action-gh-release@v3.0.3
#                               efb35369e0ad2afab669f228072c1b0d510eae64
#
# Zero spend. 100% technical English.semidark/kokoro@b96fef95e6a746495f92443fac7c688f90fc57fc
# =====================================================================
name: GENESIS v3 cloud build

on:
  workflow_dispatch:

permissions:
  contents: write   # create/update the v3-modular release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Download parts and reassemble (byte-verified)
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Parts($label, $urlsCsv, $sizesCsv, $dest, [long]$totalBytes) {
            $urls = $urlsCsv -split ','
            $sizes = $sizesCsv -split ','
            if (-not $urlsCsv) { throw "$label URL list is not set (repo Settings > Secrets and variables > Actions > Variables)." }
            if ($urls.Count -ne $sizes.Count) { throw "$label url/size count mismatch." }
            $tmp = Join-Path $env:TEMP ("parts-" + $label)
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            for ($i = 0; $i -lt $urls.Count; $i++) {
              $p = Join-Path $tmp ("part_{0:D2}" -f $i)
              Invoke-WebRequest -Uri $urls[$i] -OutFile $p
              $got = (Get-Item $p).Length
              if ($got -ne [long]$sizes[$i]) { throw "$label part $i size $got != expected $($sizes[$i])" }
            }
            $d = Split-Path $dest
            if ($d -and -not (Test-Path $d)) { New-Item -ItemType Directory -Path $d | Out-Null }
            $out = [System.IO.File]::Create($dest)
            try {
              for ($j = 0; $j -lt $urls.Count; $j++) {
                $in = [System.IO.File]::OpenRead((Join-Path $tmp ("part_{0:D2}" -f $j)))
                try { $in.CopyTo($out) } finally { $in.Close() }
              }
            } finally { $out.Close() }
            $tot = (Get-Item $dest).Length
            if ($tot -ne $totalBytes) { throw "$label total $tot != expected $totalBytes" }
            "$label OK ($tot bytes)."
          }
          Get-Parts 'tarball' '${{ vars.TARBALL_PART_URLS }}' '${{ vars.TARBALL_PART_BYTES }}' 'v2src.tar.gz' 143688439
          tar -xzf v2src.tar.gz
          if (-not (Test-Path 'genesis_windows/installer/genesis_setup.iss')) { throw 'tarball did not contain genesis_windows/.' }
          'tarball extracted.'
          Get-Parts 'ava' '${{ vars.AVA_PART_URLS }}' '${{ vars.AVA_PART_BYTES }}' 'genesis_windows/voice/engine/ava_model/model.pth' 327191691
          Get-Parts 'piper' '${{ vars.PIPER_PART_URLS }}' '${{ vars.PIPER_PART_BYTES }}' 'genesis_windows/voice/engine/fa_IR-mantatts-par.onnx' 253646036

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Inno Setup 6.7.3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Inno Setup download suspiciously small (not the real installer).' }
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after Inno install.' }
          "ISCC OK: $iscc"

      - name: Build the venv and install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$PWD\genesis_windows"
          $py = "$pkg\runtime\venv\Scripts\python.exe"
          python -m venv --copies "$pkg\runtime\venv"
          $badLinks = @(Get-ChildItem "$pkg\runtime\venv\Scripts" | Where-Object { $_.LinkType })
          if ($badLinks.Count -gt 0) { throw "venv Scripts contains $($badLinks.Count) symlinks/junctions ($($badLinks.Name -join ', ')) - refusing a non-relocatable build." }
          $pySize = (Get-Item "$pkg\runtime\venv\Scripts\python.exe").Length
          $pywSize = (Get-Item "$pkg\runtime\venv\Scripts\pythonw.exe").Length
          if ($pySize -lt 10000 -or $pywSize -lt 10000) { throw "venv python exes suspiciously small ($pySize/$pywSize bytes) - refusing build." }
          "venv exes are real copies (python.exe $pySize bytes, pythonw.exe $pywSize bytes), no links."
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $py -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'torch 2.6.0 CPU install failed.' }
          $wheel = "$pkg\voice\engine\vendor\ava_tts-0.2.0-py3-none-any.whl"
          if (-not (Test-Path $wheel)) { throw "vendored ava wheel missing: $wheel" }
          & $py -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'ava_tts wheel install failed.' }
          & $py -m pip install 'kokoro @ git+https://github.com/semidark/kokoro@b96fef95e6a746495f92443fac7c688f90fc57fc' click==8.2.1 huggingface-hub==0.34.4 numpy==1.26.4 sentencepiece==0.2.0 soundfile==0.13.1 transformers==4.51.3
          if ($LASTEXITCODE -ne 0) { throw 'kokoro / pinned voice deps install failed.' }
          & $py -m pip install --require-hashes -r "$pkg\runtime\requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw 'core requirements install failed.' }
          & $py -m pip install 'faster-whisper==1.2.1' 'sounddevice==0.5.2'
          if ($LASTEXITCODE -ne 0) { throw 'faster-whisper / sounddevice install failed.' }
          'dependencies OK.'

      - name: Pre-production gate (launcher --check)
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$PWD\genesis_windows"
          $env:GENESIS_WORKSPACE = "$pkg\kernel\genesis"
          & "$pkg\runtime\venv\Scripts\python.exe" "$pkg\runtime\launcher.py" --check
          if ($LASTEXITCODE -ne 0) { throw 'pre-production gate NOT HEALTHY; refusing to compile.' }
          'gate HEALTHY.'

      - name: Compile with ISCC (exact build_on_windows.bat command line)
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$PWD\genesis_windows"
          $out = "$pkg\build\output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DPackageDir=$pkg" "/O$out" "$pkg\installer\genesis_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw 'ISCC compilation failed.' }
          $exe = Get-ChildItem "$out\GENESIS-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'setup exe not found after compile.' }
          $hash = ((certutil -hashfile $exe.FullName SHA256 | Select-String -NotMatch 'hash' | Select-Object -First 1).ToString().Trim() -replace ' ','')
          "Setup bytes: $($exe.Length)"
          "Setup sha256: $hash"
          "SETUP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Attach to the v3-modular release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: v3-modular
          name: GENESIS v3 (modular core + auto-updater + ear)
          files: ${{ env.SETUP_EXE }}
