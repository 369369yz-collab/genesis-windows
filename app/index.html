<!DOCTYPE html>
<!-- GENESIS — Room design. Approved by YZ 2026-10-15 (all 13 themes). Chat panel + portrait card + mic + pill row. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENESIS</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body data-theme="deep-purple">
<div id="app">
  <!-- DRAG: manual JS implementation (see main.js). Tauri's
       data-tauri-drag-region never moved the window — not in CI
       (runs 39766699124/39806961252 V7 RED, dx=0 dy=0) nor on YZ's PC
       (0.1.0 P0 defect #2). The native drag loop needs the OS cursor to
       move; manual setPosition() works with real mice AND CDP input. -->
  <header class="topbar" id="topbar">
    <div class="brand">GENESIS</div>
    <div class="top-left">
      <div class="status-chip"><span class="dot"></span>آنلاین • آماده</div>
      <button class="theme-btn" id="themeBtn" aria-label="تم">◐</button>
      <button class="close-btn" id="closeBtn" aria-label="بستن">✕</button>
    </div>
  </header>

  <!-- Brain boot progress (2026-10-21): while the model verifies/downloads
       the user MUST see state + percent. Hidden once the brain is ready. -->
  <div id="bootBar" class="bootbar hidden">
    <div class="bootbar-row">
      <span id="bootLabel">در حال روشن‌شدن مغز...</span>
      <span id="bootPct"></span>
    </div>
    <div class="bootbar-track"><div class="bootbar-fill" id="bootFill"></div></div>
  </div>

  <main class="room">
    <section class="portrait-col">
      <div class="portrait-card">
        <img id="genesisFace" src="avatar-genesis.png" alt="GENESIS">
      </div>
      <div class="portrait-name">GENESIS</div>
      <div class="portrait-sub">همراه هوشمند شما در هر لحظه</div>
      <div class="portrait-sub dim">شروع یک تجربه شخصی و امن با GENESIS</div>
    </section>

    <section class="chat-col">
      <div class="chat-panel">
        <div class="chat-log" id="chatLog"></div>
        <div class="typing hidden" id="typing">در حال تایپ...</div>
        <div class="input-row">
          <input id="chatInput" type="text" placeholder="پیامت رو اینجا بنویس..." autocomplete="off">
          <button id="micBtn" class="mic-btn" aria-label="ویس">🎙</button>
          <button id="sendBtn" class="send-btn" aria-label="ارسال">➤</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="pills" id="pills">
    <button data-view="world369" class="pill active">جهان ۳۶۹</button>
    <button data-view="nexus" class="pill">جهان نکسوس</button>
    <button data-view="gates" class="pill">گذرگاه‌های زیست</button>
    <button data-view="chat" class="pill">گفتگو</button>
    <button data-view="settings" class="pill">تنظیمات</button>
  </nav>

  <div class="overlay hidden" id="themePicker">
    <div class="picker-head">انتخاب تم</div>
    <div class="theme-grid" id="themeGrid"></div>
    <button class="map-close" id="themeClose">بستن</button>
  </div>

  <div class="overlay hidden" id="panel">
    <div class="panel-head"><span id="panelTitle"></span></div>
    <div class="panel-body" id="panelBody"></div>
    <button class="map-close" id="panelClose">بستن</button>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
