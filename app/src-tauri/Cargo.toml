[package]
name = "genesis-final"
version = "0.1.0"
description = "GENESIS Final — avatar-first Windows desktop app (Phase 2 shell)"
authors = ["GENESIS"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Pinned to the 0.48 line: its windows-targets deps are already vendored in
# the local cargo cache (no fresh downloads needed on a flaky link).
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
